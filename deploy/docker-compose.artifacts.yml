services:
  relay:
    image: codex-control-relay:0.7.0
    build:
      context: ..
      dockerfile: deploy/relay-artifact.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      CODEX_CONTROL_DB: /data/codex-control.db
      CODEX_CONTROL_PAIRING_SECRET: ${CODEX_CONTROL_PAIRING_SECRET:?set CODEX_CONTROL_PAIRING_SECRET}
      CODEX_CONTROL_ALLOWED_ORIGINS: ${CODEX_CONTROL_ALLOWED_ORIGINS:-https://localhost}
      Logging__LogLevel__Microsoft.AspNetCore.Hosting.Diagnostics: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    volumes:
      - relay-data:/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  web:
    image: codex-control-web:0.7.0
    build:
      context: ..
      dockerfile: deploy/web-artifact.Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  gateway:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${CODEX_CONTROL_HTTP_PORT:-80}:80"
      - "${CODEX_CONTROL_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  relay-data:
